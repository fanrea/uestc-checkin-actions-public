name: Daily check-in

on:
  schedule:
    - cron: "17 21 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: "validate 仅离线检查；submit 执行一次真实提交"
        type: choice
        options:
          - validate
          - submit
        default: validate
        required: true

permissions:
  contents: read

concurrency:
  group: daily-checkin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  checkin:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'validate') ||
      vars.CHECKIN_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Run once
        run: python run_actions.py
        env:
          WECHAT_LOGIN_STATE_B64: ${{ secrets.WECHAT_LOGIN_STATE_B64 }}
          CHECKIN_COOKIE: ${{ secrets.CHECKIN_COOKIE }}
          CHECKIN_BEARER_TOKEN: ${{ secrets.CHECKIN_BEARER_TOKEN }}
          CHECKIN_PROFILE_JSON: ${{ secrets.CHECKIN_PROFILE_JSON }}
          CHECKIN_VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate' && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
